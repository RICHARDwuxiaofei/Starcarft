name: webGPT offline checks

on:
  push:
    branches: [webGPT]
    paths:
      - 'bots/webgpt/**'
      - 'requirements.txt'
      - '.github/workflows/webgpt-checks.yml'
  pull_request:
    paths:
      - 'bots/webgpt/**'
      - 'requirements.txt'
      - '.github/workflows/webgpt-checks.yml'

permissions:
  contents: read

jobs:
  offline:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.12'
          - os: windows-latest
            python: '3.13'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install isolated test dependencies
        run: python -m pip install -r bots/webgpt/requirements-dev.txt
      - name: Check Python source
        run: python -m ruff check bots/webgpt
      - name: Check formatting
        run: python -m ruff format --check bots/webgpt
      - name: Test without launching SC2
        run: python -m pytest bots/webgpt/tests -q
      - name: Compile Python modules
        run: python -m compileall -q bots/webgpt
